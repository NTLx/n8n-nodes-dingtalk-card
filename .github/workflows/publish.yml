name: Publish beta to npm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v0.1.0-beta.') || startsWith(github.ref, 'refs/tags/v0.2.0-beta.')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run verify:package
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify prerelease tag and package version
        run: |
          node -e 'const p=require("./package.json"); if (!/^0\.[12]\.0-beta\.\d+$/.test(p.version) || `v${p.version}` !== process.env.GITHUB_REF_NAME) process.exit(1)'
      - name: Publish beta with provenance
        run: npm publish --access public --tag beta --provenance
      # Temporary n8n Community Nodes compatibility: Update resolves npm latest.
      # TODO(first stable): latest must track stable; beta must never rewrite it.
      - name: Synchronize latest while no stable release exists
        id: sync_latest
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const { name, version } = require('./package.json');
          const output = execFileSync('npm', ['view', '--prefer-online', '--registry=https://registry.npmjs.org/', name, 'versions', '--json'], { encoding: 'utf8', timeout: 30_000 });
          const versions = JSON.parse(output);
          assert.ok(Array.isArray(versions) && versions.length > 0 && versions.every((value) => typeof value === 'string'), 'Invalid public version list; refusing to change latest');
          const hasStable = versions.some((value) => /^\d+\.\d+\.\d+$/.test(value));
          if (hasStable) {
            console.log('Stable release exists: beta must leave latest tracking stable.');
          } else {
            // Same Trusted Publisher/OIDC job as publish; no token fallback.
            execFileSync('npm', ['dist-tag', 'add', `${name}@${version}`, 'latest', '--registry=https://registry.npmjs.org/'], { stdio: 'inherit', timeout: 30_000 });
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `synchronized=${!hasStable}\n`);
          NODE
      - name: Verify public npm dist-tags
        env:
          SYNCHRONIZE_LATEST: ${{ steps.sync_latest.outputs.synchronized }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const name = require('./package.json').name;
          const version = require('./package.json').version;
          const deadline = Date.now() + 5 * 60 * 1000;
          const wait = new Int32Array(new SharedArrayBuffer(4));
          const synchronizeLatest = process.env.SYNCHRONIZE_LATEST === 'true';
          let last = 'no registry response';
          while (Date.now() < deadline) {
            try {
              const remaining = deadline - Date.now();
              const output = execFileSync('npm', ['view', '--prefer-online', '--registry=https://registry.npmjs.org/', name, 'dist-tags', '--json'], { encoding: 'utf8', timeout: Math.min(30_000, remaining) });
              const result = JSON.parse(output);
              const tags = Array.isArray(result) ? result[0] : result;
              last = JSON.stringify({ beta: tags?.beta, latest: tags?.latest });
              console.log(`Observed public dist-tags: ${last}`);
              if (tags?.beta === version && (!synchronizeLatest || tags?.latest === version)) {
                console.log(`Verified ${name} beta -> ${version}${synchronizeLatest ? ` and latest -> ${version}` : "; latest reserved for stable"}`);
                process.exit(0);
              }
            } catch (error) {
              last = `registry query failed (${error.code ?? error.name})`;
            }
            const remaining = deadline - Date.now();
            if (remaining > 0) Atomics.wait(wait, 0, 0, Math.min(10_000, remaining));
          }
          console.error(`Timed out waiting for ${name} beta -> ${version}${synchronizeLatest ? ` and latest -> ${version}` : ""}; last observation: ${last}`);
          process.exit(1);
          NODE
      - name: Verify published metadata and tarball
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const { mkdtempSync, mkdirSync, readFileSync, existsSync, rmSync } = require('node:fs');
          const { tmpdir } = require('node:os');
          const { join } = require('node:path');
          const name = require('./package.json').name;
          const version = require('./package.json').version;
          const deadline = Date.now() + 5 * 60 * 1000;
          const wait = new Int32Array(new SharedArrayBuffer(4));
          const temporaryRoot = mkdtempSync(join(tmpdir(), 'published-dingtalk-card-'));
          let last = 'package metadata is not available';
          let verified = false;
          try {
            for (let attempt = 1; Date.now() < deadline; attempt++) {
              const destination = join(temporaryRoot, `attempt-${attempt}`);
              mkdirSync(destination);
              try {
                const commandTimeout = () => Math.max(1, Math.min(30_000, deadline - Date.now()));
                const output = execFileSync('npm', ['view', '--prefer-online', '--registry=https://registry.npmjs.org/', `${name}@${version}`, 'version', 'dist.tarball', 'dist.integrity', 'repository.url', '--json'], { encoding: 'utf8', timeout: commandTimeout() });
                const result = JSON.parse(output);
                const metadata = Array.isArray(result) ? result[0] : result;
                assert.equal(metadata.version, version);
                assert.match(metadata['dist.tarball'], new RegExp(`^https://registry\\.npmjs\\.org/${name}/-/`));
                assert.ok(metadata['dist.integrity']);
                assert.equal(metadata['repository.url'], 'git+https://github.com/NTLx/n8n-nodes-dingtalk-card.git');
                const packedOutput = execFileSync('npm', ['pack', '--prefer-online', '--registry=https://registry.npmjs.org/', `${name}@${version}`, '--json', '--pack-destination', destination], { encoding: 'utf8', timeout: commandTimeout() });
                const packedResult = JSON.parse(packedOutput);
                const packed = Array.isArray(packedResult) ? packedResult[0] : Object.values(packedResult)[0];
                execFileSync('tar', ['-xzf', join(destination, packed.filename), '-C', destination]);
                const root = join(destination, 'package');
                const manifest = JSON.parse(readFileSync(join(root, 'package.json'), 'utf8'));
                assert.equal(manifest.version, version);
                assert.ok(existsSync(join(root, 'README.md')));
                assert.ok(existsSync(join(root, 'dist/nodes/DingTalkCard/DingTalkCard.node.js')));
                assert.ok(existsSync(join(root, 'dist/credentials/DingTalkCardApi.credentials.js')));
                console.log(JSON.stringify({ version, tarball: metadata['dist.tarball'], integrity: metadata['dist.integrity'], files: packed.files.length }));
                verified = true;
                break;
              } catch (error) {
                last = error.code ? `registry operation failed (${error.code})` : error.message;
                rmSync(destination, { recursive: true, force: true });
                console.log(`Public package verification attempt ${attempt} is not ready: ${last}`);
                const remaining = deadline - Date.now();
                if (remaining > 0) Atomics.wait(wait, 0, 0, Math.min(10_000, remaining));
              }
            }
            if (!verified) {
              console.error(`Timed out verifying public package ${name}@${version}: ${last}`);
              process.exitCode = 1;
            }
          } finally {
            rmSync(temporaryRoot, { recursive: true, force: true });
          }
          NODE
